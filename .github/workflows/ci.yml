name: CI

on:
  push:
    # A release line is <major>.x, or <major>.<minor>.x when an old minor needs
    # a patch, and '*.x' matches both: * matches dots. A pattern, so a branch
    # cut on demand is not invisible to CI.
    branches: ['*.x']
  # No branch filter on purpose. The filter matches the pull request's base, so
  # a pull request stacked on an unlisted branch would run no jobs, and show no
  # checks rather than failing ones.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - run: npm i

    - run: npm run build

    - run: npm run lint

    - run: npm test --reporters=jest-junit --runInBand

    - name: Codecov
      uses: codecov/codecov-action@v3.1.0
